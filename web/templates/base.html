<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} — {{ T.tagline }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='icon-64.png') }}" alt="Workapp" width="24" height="24"> {{ app_name }}</a>
  <a href="{{ url_for('index') }}">{{ T.nav_home }}</a>
  <a href="{{ url_for('jobs') }}">{{ T.nav_results }}</a>
  <span class="spacer"></span>
  <a href="{{ url_for('set_lang', lang='es') }}" class="{% if lang=='es' %}active{% endif %}">ES</a>
  <span class="sep">|</span>
  <a href="{{ url_for('set_lang', lang='en') }}" class="{% if lang=='en' %}active{% endif %}">EN</a>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>{{ T.footer }}</footer>
</body>
</html>
